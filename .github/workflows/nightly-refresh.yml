name: nightly-refresh

on:
  schedule:
    # 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run nightly update
        run: python scripts/update_nightly.py

      - name: Verify
        run: python scripts/verify.py

      - name: Detect DB changes
        id: db_changes
        run: |
          if git diff --quiet --exit-code -- data/solar_system.sqlite; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create refresh PR
        if: steps.db_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7.0.8
        with:
          add-paths: data/solar_system.sqlite
          branch: nightly-refresh
          commit-message: "chore(data): nightly refresh"
          delete-branch: true
          title: "chore(data): nightly refresh"
          body: |
            Automated nightly refresh for `data/solar_system.sqlite`.
