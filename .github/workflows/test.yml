name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install --yes zstd
          python -m pip install --upgrade pip
          pip install -e '.[dev,publish]' -e ./mcp-server -e ./api

      - name: Check API imports
        run: python -m ruff check --select F401 api/main.py

      - name: Verify DB
        run: python scripts/verify.py

      - name: Smoke tests — MCP server + REST API
        run: pytest mcp-server/tests/ api/tests/ -v --import-mode=importlib
