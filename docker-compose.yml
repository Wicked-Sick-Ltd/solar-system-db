# solar-system-db — public hosting stack
#
# Brings up:
#   * rest-api    — FastAPI (port 8003), read-only REST/JSON over the catalogue
#   * mcp-server  — FastMCP streamable-HTTP (port 8002) for remote MCP clients
#   * caddy       — reverse proxy on :80/:443 routing /api, /docs, /mcp, /
#
# The SQLite DB lives at ./data/solar_system.sqlite, mounted read-only into
# both backend services. It is NOT in git: the build host publishes a fresh
# artefact nightly to object storage and scripts/pull_latest.sh (cron) downloads,
# verifies and swaps it in, then recycles the two services.
#
# The `build` profile (docker compose --profile build …) is for the BUILD HOST
# only: a one-shot nightly builder/publisher and the long-lived crawler.

services:
  rest-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: solar-rest-api
    restart: unless-stopped
    environment:
      - SOLAR_DB_PATH=/data/solar_system.sqlite
      - API_HOST=0.0.0.0
      - API_PORT=8003
    volumes:
      - ./data:/data:ro
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: solar-mcp-server
    restart: unless-stopped
    environment:
      - SOLAR_DB_PATH=/data/solar_system.sqlite
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8002
    volumes:
      - ./data:/data:ro
    expose:
      - "8002"

  caddy:
    image: caddy:2-alpine
    container_name: solar-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rest-api
      - mcp-server

  # ---- build host only (docker compose --profile build up -d crawler; run builder from a timer) ----
  builder:
    profiles: ["build"]
    build:
      context: .
      dockerfile: build/Dockerfile
    container_name: solar-builder
    environment:
      - S3_BUCKET=${S3_BUCKET:-solar-system-db}
      - S3_ENDPOINT=${S3_ENDPOINT:-https://4ce32b0dd5d81195ffdef6d24d1a8297.r2.cloudflarestorage.com}
      - S3_PUBLIC_BASE=${S3_PUBLIC_BASE:-https://download.sol.wickedsick.com}
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_DEFAULT_REGION=${S3_REGION:-auto}
      - S3_REGION
      - S3_NO_ACL=${S3_NO_ACL:-1}
    volumes:
      - ${SOLAR_DATA_DIR:-./data}:/data
      - build_scratch:/build

  crawler:
    profiles: ["build"]
    build:
      context: .
      dockerfile: build/Dockerfile
    container_name: solar-crawler
    restart: unless-stopped
    environment:
      - CRAWLER_RPS=${CRAWLER_RPS:-1.0}
    volumes:
      - ${SOLAR_DATA_DIR:-./data}:/data
    command: ["bash", "-lc", "while true; do python scripts/enrich_crawler.py --store /data/enrichment.sqlite --db /data/solar_system.sqlite --rps \"$$CRAWLER_RPS\" || sleep 60; sleep 5; done"]

volumes:
  caddy_data:
  caddy_config:
  build_scratch:
