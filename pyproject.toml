[project]
name = "solar-system-db"
version = "0.1.0"
description = "Replicatable database of known solar system objects, refreshed nightly from JPL/MPC. For astronomy, not astrology."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Craig Fletcher" }]
keywords = ["astronomy", "solar system", "planets", "asteroids", "comets",
            "ephemeris", "sqlite", "mcp"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]
mcp = [
    "mcp>=1.0.0,<2",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "slowapi>=0.1.9",
]
all = [
    "mcp>=1.0.0,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "slowapi>=0.1.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["solar_db"]

[tool.pytest.ini_options]
testpaths = ["mcp-server/tests", "api/tests"]
addopts = "--import-mode=importlib"
