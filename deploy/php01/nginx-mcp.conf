# Include inside the existing api.sol.wickedsick.com TLS server block.
# Keep its REST, TLS, rate-limit and Forge-managed configuration intact.
# No URI suffix on proxy_pass: preserve /mcp and the session/query parameters.
#
# limit_req_zone is not legal in a server snippet. Add this once in the http
# context (Forge's nginx.conf) before reloading:
#
#   limit_req_zone $binary_remote_addr zone=mcp_http:10m rate=60r/m;
#
# 60r/m matches the REST default per-IP ceiling so /mcp cannot outrun ordinary
# catalogue routes. The tighter observing quotas (10/minute night, 5/minute
# discover) are enforced in the MCP process, per tool, and are not visible to
# nginx. $binary_remote_addr is the client nginx accepted (the Cloudflare hop
# when that proxy is in front), which is the same address the app reads from
# X-Real-IP.
location = /mcp {
    limit_req zone=mcp_http burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

location ^~ /mcp/ {
    limit_req zone=mcp_http burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}
